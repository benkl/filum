<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  @font-face { font-family: Inter; src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { display: grid; grid-template-columns: 1fr 520px; align-items: center; background: radial-gradient(circle at 78% 50%, rgba(124,58,237,.16), transparent 55%), #f1f1ee; font-family: Inter, sans-serif; color: #24262a; overflow: hidden; }
  .copy { padding-left: 84px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; letter-spacing: -.02em; }
  .brand img { width: 46px; height: 46px; }
  h1 { margin: 42px 0 0; font-size: 84px; line-height: 1; letter-spacing: -.04em; font-weight: 800; }
  h1 span { color: #7c3aed; background: linear-gradient(90deg, currentColor 58%, transparent 0) 0 100% / 20px 6px repeat-x; padding-bottom: 6px; }
  p { margin: 30px 0 0; font-size: 26px; color: #6e706f; max-width: 560px; line-height: 1.35; }
  .art { width: 560px; margin-left: -40px; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="../public/icon.svg" alt="" /> Filum</div>
    <h1>From picture<br />to <span>stitches</span>.</h1>
    <p>A free, open-source machine-embroidery editor.</p>
  </div>
  <img class="art" src="../public/renders/logo-3d@half.webp" alt="" />
</body></html>
